modmap:
  - name: physical keyboard normalization (common)
    remap:
      ro: rightctrl

  - name: physical keyboard normalization (NuPhy Node 75 JIS)
    device:
      only: 'Node 75 LP JIS'
    remap:
      rightctrl: left
      left: down
      down: up
      up: rightctrl
      katakanahiragana: rightmeta
      home: pageup
      end: pagedown
      pageup: home
      pagedown: end

  - name: capslock mod-tap rule
    remap:
      capslock:
        held: leftctrl
        alone: esc
        alone_timeout_millis: 400

  - name: backspace mod-tap rule
    device:
      only: 'Node 75 LP JIS'
    remap:
      backspace:
        held: rightshift
        alone: backspace
        alone_timeout_millis: 300

  - name: space mod-tap rule
    remap:
      space:
        held: [leftmeta, leftalt, leftctrl]
        alone: space
        alone_timeout_millis: 300

  - name: original keyboard layout based on colemak
    remap:
      d: s
      e: f
      f: t
      g: d
      i: u
      j: n
      k: e
      l: i
      n: k
      o: g
      p: y
      r: p
      s: r
      t: semicolon
      u: l
      y: j
      semicolon: o

keymap:
  - name: copy, paste, cut, undo, redo, select all
    exact_match: true
    application:
      # wezterm and zed sets up application-level key bindings
      not: [org.wezfurlong.wezterm, dev.zed.Zed]
    remap:
      super-c: ctrl-c
      super-v: ctrl-v
      super-x: ctrl-x
      super-z: ctrl-z
      super-shift-z: ctrl-shift-z
      super-a: ctrl-a

  - name: ctrl editing rule
    exact_match: true
    remap:
      ctrl_l-k: backspace
      ctrl_l-m: enter
      ctrl_l-h: left
      ctrl_l-n: down
      ctrl_l-e: up
      ctrl_l-i: right

  - name: hyper-mod rule
    remap:
      super-alt-ctrl-t: grave

  - name: browser rule
    exact_match: true
    application:
      only: [brave-origin]
    remap:
      ctrl-minus: alt-left            # Back
      ctrl-equal: alt-right           # Forward
      super-rightbrace: ctrl-pagedown # Next tab
      super-leftbrace: ctrl-pageup    # Previous tab
      super-f: ctrl-f                 # Find
      super-w: ctrl-w                 # Close tab
      super-t: ctrl-t                 # New tab
      super-r: ctrl-r                 # Reload
      super-minus: ctrl-minus         # Zoom out
      super-equal: ctrl-equal         # Zoom in
      super-l: ctrl-l                 # Focus location
      super-shift-b: ctrl-shift-b     # Show bookmarks
      super-n: ctrl-n                 # New window
      super-shift-n: ctrl-shift-n     # New private window
      super-shift-t: ctrl-shift-t     # Reopen closed tab
      super-b: ctrl-b                 # Toggle sidebar
      # Select tab N
      super-1: ctrl-1
      super-2: ctrl-2
      super-3: ctrl-3
      super-4: ctrl-4
      super-5: ctrl-5
      super-6: ctrl-6
      super-7: ctrl-7
      super-8: ctrl-8
      super-9: ctrl-9
